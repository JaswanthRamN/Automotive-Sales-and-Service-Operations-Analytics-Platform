name: automotive-analytics

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-automotive_analytics}
  POSTGRES_USER: ${POSTGRES_USER:-automotive_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_SSLMODE: disable
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-env
    <<: *app-env
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set URL-safe AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    ETL_PROCESSED_DIR: /opt/project/data/processed
    ETL_LOG_PATH: /opt/airflow/logs/etl.log
    AIRFLOW_DAG_SCHEDULE: ${AIRFLOW_DAG_SCHEDULE:-@daily}
    AIRFLOW_DAG_RETRIES: ${AIRFLOW_DAG_RETRIES:-2}
    AIRFLOW_RETRY_DELAY_MINUTES: ${AIRFLOW_RETRY_DELAY_MINUTES:-5}
    AIRFLOW_MAX_RETRY_DELAY_MINUTES: ${AIRFLOW_MAX_RETRY_DELAY_MINUTES:-30}
    AIRFLOW_TASK_TIMEOUT_MINUTES: ${AIRFLOW_TASK_TIMEOUT_MINUTES:-60}
    AIRFLOW_QUALITY_TIMEOUT_MINUTES: ${AIRFLOW_QUALITY_TIMEOUT_MINUTES:-15}
  volumes:
    - airflow-logs:/opt/airflow/logs
    - ./data/processed:/opt/project/data/processed:ro
  networks: [analytics]
  restart: unless-stopped
  depends_on:
    airflow-init:
      condition: service_completed_successfully
    warehouse-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automotive_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-automotive_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:5432"]
    networks: [analytics]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}
    volumes: [airflow-db-data:/var/lib/postgresql/data]
    networks: [analytics]
    restart: unless-stopped
    healthcheck:
      test: [CMD, pg_isready, -U, airflow, -d, airflow]
      interval: 10s
      timeout: 5s
      retries: 10

  warehouse-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment: *app-env
    command: [python, docker/bootstrap.py]
    networks: [analytics]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      <<: *app-env
      API_DB_POOL_SIZE: ${API_DB_POOL_SIZE:-5}
      API_DB_MAX_OVERFLOW: ${API_DB_MAX_OVERFLOW:-10}
      API_DB_POOL_TIMEOUT_SECONDS: ${API_DB_POOL_TIMEOUT_SECONDS:-30}
      API_DB_CONNECT_TIMEOUT_SECONDS: ${API_DB_CONNECT_TIMEOUT_SECONDS:-10}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    networks: [analytics]
    restart: unless-stopped
    depends_on:
      warehouse-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-init:
    <<: *airflow
    command: version
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD}

  airflow-webserver:
    <<: *airflow
    command: api-server
    ports: ["127.0.0.1:${AIRFLOW_UI_PORT:-8080}:8080"]
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  analytics:
    driver: bridge

volumes:
  postgres-data:
  airflow-db-data:
  airflow-logs:
