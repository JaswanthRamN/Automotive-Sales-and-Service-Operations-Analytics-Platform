name: Python and configuration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest --cov=api --cov-report=term-missing --cov-fail-under=80
      - name: Validate Compose with disposable CI values
        env:
          POSTGRES_PASSWORD: ci-test-only
          AIRFLOW_DB_PASSWORD: ci-test-only
          AIRFLOW_ADMIN_PASSWORD: ci-test-only
          AIRFLOW_FERNET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          AIRFLOW_JWT_SECRET: ci-test-only
        run: docker compose config --quiet
